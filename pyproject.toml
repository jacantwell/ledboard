[project]
name = "ledboard"
version = "0.1.0"
description = "Display daemon, apps and simulator for the jasperpi LED matrix"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.2,<3",
  "pillow>=11",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "websockets>=14",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
]

[project.optional-dependencies]
# Only resolvable on the Pi. Laptops run without it and use the web/png/array displays.
hw = [
  "adafruit-blinka-raspberry-pi5-piomatter==1.0.0; platform_machine == 'aarch64' and sys_platform == 'linux'",
]

[project.scripts]
ledboard = "ledboard.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.28",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledboard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
